name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: learning-notes/package-lock.json

      - uses: actions/configure-pages@v5

      - name: Fetch private bookmarks data
        env:
          BOOKMARKS_TOKEN: ${{ secrets.BOOKMARKS_TOKEN }}
        run: |
          mkdir -p learning-notes/public
          curl -sH "Authorization: token $BOOKMARKS_TOKEN" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o learning-notes/public/bookmarks.json \
            "https://api.github.com/repos/siweky/daydayup-data/contents/bookmarks.json"

      - name: Install dependencies
        run: npm ci
        working-directory: learning-notes

      - name: Generate static site
        run: npx nuxi generate
        working-directory: learning-notes

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: learning-notes/.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
